name: 创业板量化策略
on:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: cd src && python daily_runner.py --trade > output.txt 2>&1
      - run: cat output.txt
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[cyb] #${{ github.run_number }}"
          to: 1134230834@qq.com
          from: ${{ secrets.QQ_EMAIL }}
          body: file://output.txt