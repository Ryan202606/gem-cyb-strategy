name: 创业板量化策略 - 每日运行

on:
  schedule:
    - cron: '0 12 * * *'   # UTC 12:00 = 北京时间 20:00
  push:
    branches: [main]
  workflow_dispatch:        # 手动触发

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy
        id: run
        run: |
          cd src
          python daily_runner.py --trade > /tmp/strategy_output.txt 2>&1
          cat /tmp/strategy_output.txt

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[创业板量化] ${{ github.run_number }} - ${{ github.run_id }}"
          to: 1134230834@qq.com
          from: ${{ secrets.QQ_EMAIL }}
          body: file:///tmp/strategy_output.txt
