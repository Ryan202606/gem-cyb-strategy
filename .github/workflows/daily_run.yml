name: gem-cyb-strategy
on:
  schedule:
    - cron: 0 10 * * 1-5
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt
      - run: |
          echo "[CYB]" > output.txt
          cd src && python daily_runner.py --trade >> ../output.txt 2>&1
          echo "" >> ../output.txt
          echo "[DIV]" >> ../output.txt
          python dividend_runner.py --trade >> ../output.txt 2>&1
      - run: cat output.txt
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[Q] 每日信号"
          to: 1134230834@qq.com
          from: ${{ secrets.QQ_EMAIL }}
          body: file://output.txt
      - name: Commit & push trade history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_history.csv dividend_trade_history.csv
          git commit -m "chore: update trade history" || echo "no changes to commit"
          git push || echo "push skipped"