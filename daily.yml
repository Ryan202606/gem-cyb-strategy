name: gem-cyb-strategy
on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: cd src && python daily_runner.py --trade
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[创业板量化] 每日报告"
          to: 1134230834@qq.com
          from: ${{ secrets.QQ_EMAIL }}
          body: file:///tmp/out.txt